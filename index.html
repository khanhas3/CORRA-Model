<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORRA Swap Pricer</title>
<style>
  body{margin:0;background:#0b0f14;color:#d6dde5;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 48px}
  h1{margin:0 0 16px;font:700 22px ui-monospace,Consolas,monospace;color:#2dd4bf}
  h2{margin:0 0 10px;font-size:15px;color:#2dd4bf}
  .box{background:#11161d;border:1px solid #1f2833;border-radius:4px;padding:14px;margin-bottom:12px}
  .row{display:flex;flex-wrap:wrap;gap:12px}
  label{display:block;font-size:12px;color:#7c8896;margin-bottom:3px}
  input,select{width:130px;padding:5px 7px;background:#0b0f14;color:#d6dde5;border:1px solid #2c3846;border-radius:3px;font:14px ui-monospace,Consolas,monospace}
  button{padding:7px 14px;border:1px solid #2c3846;border-radius:3px;background:#151b24;color:#d6dde5;font:600 13px system-ui,sans-serif;cursor:pointer}
  button.go{background:#2dd4bf;border-color:#2dd4bf;color:#0b0f14}
  table{border-collapse:collapse;font:13px ui-monospace,Consolas,monospace}
  th,td{padding:3px 12px 3px 0;text-align:right;white-space:nowrap}
  th{color:#7c8896;font:600 12px system-ui,sans-serif}
  th:first-child,td:first-child{text-align:left}
  .big{font:700 20px ui-monospace,Consolas,monospace}
  .pos{color:#36c26b} .neg{color:#ff5a4f} .mut{color:#7c8896;font-size:12px}
  .scroll{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">
  <h1>CORRA SWAP PRICER</h1>

  <div class="box">
    <h2>Bank of Canada</h2>
    <div class="row">
      <div><label>CORRA</label><span class="big" id="corra">—</span></div>
      <div><label>Date</label><span class="big" id="corraDate">—</span></div>
    </div>
  </div>

  <div class="box">
    <h2>OIS par rates (%)</h2>
    <div class="row" id="quotes"></div>
  </div>

  <div class="box">
    <h2>Trade</h2>
    <div class="row">
      <div><label>Valuation date</label><input type="date" id="valDate"></div>
      <div><label>Side</label><select id="side"><option value="1">Pay fixed</option><option value="-1">Receive fixed</option></select></div>
      <div><label>Notional</label><input id="notional" placeholder="100,000,000"></div>
      <div><label>Fixed rate (%)</label><input id="fixed" placeholder="3.06"></div>
      <div><label>Tenor (years)</label><select id="tenor"></select></div>
    </div>
    <p><button class="go" id="calc">Calculate</button> <button id="example">Example</button></p>
    <div class="mut" id="msg"></div>
  </div>

  <div class="box">
    <h2>Result</h2>
    <div class="row">
      <div><label>PV</label><span class="big" id="pv">—</span></div>
      <div><label>DV01</label><span class="big" id="dv01">—</span></div>
      <div><label>Breakeven rate</label><span class="big" id="be">—</span></div>
    </div>
    <h2 style="margin-top:16px">Cash flows</h2>
    <div class="scroll"><table id="cf"></table></div>
  </div>

  <p class="mut">Semi-annual payments, ACT/365. Discount factors are solved one period at a time so every par swap is worth zero. DV01 is the change in PV when all rates rise 1bp.</p>
</div>

<script>
// ---------- Inputs ----------
const TENORS = [0.5, 1, 2, 3, 5, 7, 10];               // years
const EXAMPLE = [2.53, 2.60, 2.76, 2.88, 3.06, 3.19, 3.34];  // illustrative, not market data

const quotesDiv = document.getElementById('quotes');
TENORS.forEach((t, i) => {
  quotesDiv.innerHTML += `<div><label>${t < 1 ? t * 12 + 'M' : t + 'Y'}</label><input id="q${i}" style="width:80px"></div>`;
});
for (let y = 1; y <= 10; y++) document.getElementById('tenor').innerHTML += `<option ${y === 5 ? 'selected' : ''}>${y}</option>`;
document.getElementById('valDate').value = new Date().toISOString().slice(0, 10);

const num = id => parseFloat(document.getElementById(id).value.replace(/,/g, ''));
const money = v => (Math.abs(v) < 0.005 ? 0 : v).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

// ---------- Dates ----------
const DAY = 86400000;
function addMonths(d, m) {
  const r = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + m, 1));
  const last = new Date(Date.UTC(r.getUTCFullYear(), r.getUTCMonth() + 1, 0)).getUTCDate();
  r.setUTCDate(Math.min(d.getUTCDate(), last));
  return r;
}
const isWeekend = d => d.getUTCDay() === 0 || d.getUTCDay() === 6;
function modFollowing(d) {                              // move off weekends, stay in the same month
  let f = new Date(d);
  while (isWeekend(f)) f = new Date(f.getTime() + DAY);
  if (f.getUTCMonth() === d.getUTCMonth()) return f;
  let b = new Date(d);
  while (isWeekend(b)) b = new Date(b.getTime() - DAY);
  return b;
}
const fmtDate = d => d.toLocaleDateString('en-US', {timeZone: 'UTC', month: 'short', day: 'numeric', year: 'numeric'});

// ---------- Curve ----------
// Linear interpolation of par rates at time t (years)
function parRate(rates, t) {
  if (t <= TENORS[0]) return rates[0];
  for (let i = 1; i < TENORS.length; i++) {
    if (t <= TENORS[i]) return rates[i - 1] + (rates[i] - rates[i - 1]) * (t - TENORS[i - 1]) / (TENORS[i] - TENORS[i - 1]);
  }
  return rates[rates.length - 1];
}
// Bootstrap discount factors on a semi-annual grid
function bootstrap(rates, taus) {
  const df = [];
  let annuity = 0;                                     // running sum of tau * DF
  taus.forEach((tau, i) => {
    const s = parRate(rates, (i + 1) / 2);
    df.push((1 - s * annuity) / (1 + s * tau));
    annuity += tau * df[i];
  });
  return df;
}
// PV of the swap from your side
function price(df, taus, notional, fixed, side) {
  let annuity = 0;
  taus.forEach((tau, i) => annuity += tau * df[i]);
  const pvFloat = notional * (1 - df[df.length - 1]);
  const pvFixed = notional * fixed * annuity;
  return {pv: side * (pvFloat - pvFixed), breakeven: (1 - df[df.length - 1]) / annuity};
}

// ---------- Calculate ----------
function calculate() {
  const msg = document.getElementById('msg');
  const rates = TENORS.map((t, i) => num('q' + i) / 100);
  const notional = num('notional'), fixed = num('fixed') / 100;
  const side = +document.getElementById('side').value, years = +document.getElementById('tenor').value;
  const val = new Date(document.getElementById('valDate').value + 'T00:00:00Z');
  if (rates.some(isNaN) || isNaN(notional) || isNaN(fixed) || isNaN(val)) { msg.textContent = 'Fill in every rate and the trade.'; return; }
  msg.textContent = '';

  // Schedule: start on the valuation date (next business day), then every 6 months
  const start = modFollowing(val);
  const dates = [start];
  for (let i = 1; i <= years * 2; i++) dates.push(modFollowing(addMonths(start, 6 * i)));
  const taus = dates.slice(1).map((d, i) => (d - dates[i]) / DAY / 365);

  const df = bootstrap(rates, taus);
  const dfUp = bootstrap(rates.map(r => r + 0.0001), taus);
  const base = price(df, taus, notional, fixed, side);
  const up = price(dfUp, taus, notional, fixed, side);

  const show = (id, v) => { const el = document.getElementById(id); el.textContent = money(v); el.className = 'big ' + (v > 0.005 ? 'pos' : v < -0.005 ? 'neg' : ''); };
  show('pv', base.pv);
  show('dv01', up.pv - base.pv);
  document.getElementById('be').textContent = (base.breakeven * 100).toFixed(4) + '%';

  let rows = '<tr><th>Pay date</th><th>Fixed</th><th>Float</th><th>DF</th><th>PV</th></tr>';
  let total = 0;
  taus.forEach((tau, i) => {
    const prev = i === 0 ? 1 : df[i - 1];
    const fixedCF = -side * notional * fixed * tau;
    const floatCF = side * notional * (prev / df[i] - 1);
    const pv = (fixedCF + floatCF) * df[i];
    total += pv;
    rows += `<tr><td>${fmtDate(dates[i + 1])}</td><td>${money(fixedCF)}</td><td>${money(floatCF)}</td><td>${df[i].toFixed(6)}</td><td>${money(pv)}</td></tr>`;
  });
  rows += `<tr><th>Total</th><td></td><td></td><td></td><th>${money(total)}</th></tr>`;
  document.getElementById('cf').innerHTML = rows;
}

document.getElementById('calc').onclick = calculate;
document.getElementById('example').onclick = () => {
  EXAMPLE.forEach((r, i) => document.getElementById('q' + i).value = r);
  document.getElementById('notional').value = '100,000,000';
  document.getElementById('fixed').value = '3.06';
  calculate();
  document.getElementById('msg').textContent = 'Example rates, not market data.';
};

// ---------- Live CORRA from the Bank of Canada ----------
fetch('https://www.bankofcanada.ca/valet/observations/AVG.INTWO/json?recent=1')
  .then(r => r.json())
  .then(j => {
    const o = j.observations[0];
    document.getElementById('corra').textContent = parseFloat(o['AVG.INTWO'].v).toFixed(2) + '%';
    document.getElementById('corraDate').textContent = fmtDate(new Date(o.d + 'T00:00:00Z'));
  })
  .catch(() => document.getElementById('corraDate').textContent = 'Unavailable');
</script>
</body>
</html>
